server:
  port: 8083

spring:
  application:
    name: media-service
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

gcp:
  project-id: ${GCP_PROJECT_ID:enterprise-cloud-module-503705}
  storage:
    bucket-name: ${GCP_BUCKET_NAME:enterprise-cloud-media-bucket}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
